<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Dhia Mokhtari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Ctext x='16' y='22' font-family='Inter,sans-serif' font-size='16' font-weight='800' fill='white' text-anchor='middle'%3EDM%3C/text%3E%3C/svg%3E" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0a0a0f;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .wrapper {
      text-align: center;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }
    .code {
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #818cf8, #06b6d4, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 1rem;
      animation: pulse404 3s ease-in-out infinite;
    }
    @keyframes pulse404 {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(0.98); }
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 1rem; }
    p { color: #94a3b8; font-size: 1.0625rem; margin-bottom: 2rem; max-width: 400px; line-height: 1.7; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 32px; border-radius: 100px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff; font-size: 1rem; font-weight: 600;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(99,102,241,0.3);
      transition: all 0.3s ease;
    }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 40px rgba(99,102,241,0.5); }
    /* Background blobs */
    .blob {
      position: fixed; border-radius: 50%; filter: blur(100px); opacity: 0.15;
      animation: blobFloat 10s ease-in-out infinite alternate;
    }
    .blob-1 { width: 400px; height: 400px; background: #6366f1; top: -100px; right: -100px; }
    .blob-2 { width: 350px; height: 350px; background: #06b6d4; bottom: -100px; left: -100px; animation-delay: 4s; }
    @keyframes blobFloat { from { transform: translate(0,0) scale(1); } to { transform: translate(30px,-20px) scale(1.1); } }
    .mono { font-family: 'JetBrains Mono', monospace; color: #64748b; font-size: 0.875rem; }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="wrapper">
    <div class="code">404</div>
    <h1>Lost in the latent space</h1>
    <p>The page you're looking for seems to have vanished into the void. Maybe it was never trained on this data.</p>
    <p class="mono">Error: page_not_found at /${location.pathname}</p>
    <a href="/" class="btn">← Back to Portfolio</a>
  </div>
  <script>
    document.querySelector('.mono').textContent = `Error: page_not_found at ${location.pathname}`;
  </script>
</body>
</html>
